map_server:
  ros__parameters:
    use_sim_time: false
    frame_id: odom
    topic_name: map
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.05
      downsample_costmap: false
      allow_unknown: false
      max_iterations: 100000
      max_on_approach_iterations: 1000
      smooth_path: true

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # Match NavigationSession's odometry progress criterion.  This remains
      # strict enough to detect a stationary base, while avoiding false
      # stalls when the official simulator runs below real time near a goal.
      required_movement_radius: 0.01
      movement_time_allowance: 5.0
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      # Leave margin for the semantic layer's independently measured 0.10 m
      # exact-goal contract; otherwise a grid-relocated endpoint can be
      # accepted by FollowPath and then correctly rejected by the action.
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.12
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.35
      lookahead_dist: 0.35
      min_lookahead_dist: 0.18
      max_lookahead_dist: 0.55
      lookahead_time: 1.0
      rotate_to_heading_angular_vel: 0.45
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.60
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.2
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.45
      regulated_linear_scaling_min_speed: 0.08
      allow_reversing: false
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.55
      max_angular_accel: 1.0
      max_robot_pose_search_dist: 2.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.3
      resolution: 0.05
      track_unknown_space: false
      footprint: "[[0.2587,0.24],[0.2587,-0.24],[-0.2413,-0.24],[-0.2413,0.24]]"
      footprint_padding: 0.0
      plugins: ["static_layer", "obstacle_layer", "confirmed_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /nav/scan
          max_obstacle_height: 1.5
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 5.0
          raytrace_min_range: 0.05
          obstacle_max_range: 4.5
          obstacle_min_range: 0.08
      confirmed_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: confirmed
        confirmed:
          topic: /nav/confirmed_obstacles
          max_obstacle_height: 1.5
          clearing: false
          marking: true
          data_type: PointCloud2
          observation_persistence: 1.5
          expected_update_rate: 0.5
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.30
      always_send_full_costmap: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 12.0
      publish_frequency: 5.0
      transform_tolerance: 0.3
      rolling_window: true
      # Humble declares these parameters as integers.  A YAML float makes the
      # controller server abort before lifecycle configuration completes.
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.2587,0.24],[0.2587,-0.24],[-0.2413,-0.24],[-0.2413,0.24]]"
      footprint_padding: 0.0
      plugins: ["obstacle_layer", "confirmed_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /nav/scan
          max_obstacle_height: 1.5
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 5.0
          raytrace_min_range: 0.05
          obstacle_max_range: 4.5
          obstacle_min_range: 0.08
      confirmed_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: confirmed
        confirmed:
          topic: /nav/confirmed_obstacles
          max_obstacle_height: 1.5
          clearing: false
          marking: true
          data_type: PointCloud2
          observation_persistence: 1.5
          expected_update_rate: 0.5
          obstacle_max_range: 8.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.30
      always_send_full_costmap: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 20.0
    behavior_plugins: ["backup"]
    backup:
      plugin: "nav2_behaviors/BackUp"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 1.0
    max_rotational_vel: 0.4
    min_rotational_vel: 0.1
    rotational_acc_lim: 1.0

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 50.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.35, 0.0, 0.50]
    min_velocity: [-0.10, 0.0, -0.50]
    max_accel: [0.45, 0.0, 1.0]
    max_decel: [-0.55, 0.0, -1.2]
    odom_topic: /nav/odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.2

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: /motion/smoothed_cmd_vel
    cmd_vel_out_topic: /cmd_vel
    transform_tolerance: 0.3
    source_timeout: 0.5
    stop_pub_timeout: 1.0
    base_shift_correction: true
    polygons: ["PolygonStop", "PolygonSlow", "FootprintApproach"]
    PolygonStop:
      type: polygon
      points: [0.29, 0.26, 0.29, -0.26, -0.32, -0.26, -0.32, 0.26]
      action_type: stop
      max_points: 0
      visualize: true
      polygon_pub_topic: polygon_stop
    PolygonSlow:
      type: polygon
      points: [0.55, 0.38, 0.55, -0.38, -0.48, -0.38, -0.48, 0.38]
      action_type: slowdown
      slowdown_ratio: 0.30
      max_points: 0
      visualize: true
      polygon_pub_topic: polygon_slow
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: /motion/safety_footprint
      time_before_collision: 1.0
      simulation_time_step: 0.05
      # Nav2 Humble 1.1.x checks the initial footprint with
      # ``inside_points >= max_points``.  A zero threshold therefore reports
      # a collision even when the footprint contains no scan points and
      # suppresses every velocity command.  Keep the upstream default so a
      # real point cluster, rather than the empty set, triggers approach mode.
      max_points: 3
      visualize: true
      polygon_pub_topic: polygon_footprint_approach
    observation_sources: ["scan"]
    scan:
      type: scan
      topic: /nav/scan

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    bond_timeout: 4.0
    node_names: ["map_server", "planner_server", "controller_server", "behavior_server", "velocity_smoother", "collision_monitor"]
